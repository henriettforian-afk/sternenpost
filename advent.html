<script>
/* leiser Schneefall (nur wenn keine reduzierte Bewegung gewünscht ist) */
(function () {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = document.getElementById("bgsnow"), cx = cv.getContext("2d"), W, H, fl = [];
  function size() { var d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    fl = []; var n = Math.round(W * H / 16000); for (var i = 0; i < n; i++) fl.push({ x: Math.random() * W, y: Math.random() * H, r: 1.2 + Math.random() * 2.2, s: 0.25 + Math.random() * 0.5, p: Math.random() * 6.28 }); }
  function tick() { cx.clearRect(0, 0, W, H); cx.fillStyle = "rgba(255,255,255,.9)";
    fl.forEach(function (f) { f.y += f.s; f.p += 0.012; f.x += Math.sin(f.p) * 0.3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.283); cx.fill(); });
    requestAnimationFrame(tick); }
  size(); addEventListener("resize", size); tick();
})();
</script>
